# Mantém o web service no Render (free) acordado: dorme ~15 min sem HTTP.
# Configure o secret RENDER_SERVICE_URL (ex.: https://backend-enem-read.onrender.com).
# Ping a cada 14 min, só 06:00–23:59 America/Sao_Paulo (madrugada omitida).
# Alternativa sem GitHub: docs/render-keep-alive.md
name: Render keep-alive

on:
  schedule:
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: GET public root (keep-alive)
        env:
          RENDER_SERVICE_URL: ${{ secrets.RENDER_SERVICE_URL }}
        run: |
          if [ -z "$RENDER_SERVICE_URL" ]; then
            echo "RENDER_SERVICE_URL não configurado — job ignorado (veja docs/render-keep-alive.md)."
            exit 0
          fi
          hour=$((10#$(TZ=America/Sao_Paulo date +%H)))
          if [ "$hour" -lt 6 ]; then
            echo "Fora da janela 06:00–23:59 America/Sao_Paulo; keep-alive omitido."
            exit 0
          fi
          base="${RENDER_SERVICE_URL%/}"
          curl -fsS --max-time 120 "${base}/"
